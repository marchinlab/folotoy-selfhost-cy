# FoloToy 自建服务端 —— 火火兔 g6 / Hv0.8.1.3 / Sv25.6.4.49
# 部署位置：云电脑（Linux x86_64，需 Docker + Docker Compose；Windows 本机 WSL1 跑不了）
# 用法：把整个 folotoy-selfhost 目录拷到云电脑 -> cp .env.example .env -> 填 .env -> docker compose up -d
#
# 必须放行（云厂商安全组 + 系统防火墙）：
#   1883/tcp  MQTT（玩具连服务端）          必需
#   8082/tcp  音频文件下载（nginx）          必需
#   8085/udp  实时语音上传                  必需，注意是 UDP，最容易漏
#   18083/tcp EMQX 控制台 admin/public       可选，但强烈建议上线后改密码或关掉
#   8083/tcp  MQTT over WebSocket            可选
# 警告：cloudflared / lhr.life / cpolar 这类 HTTP 隧道不能转发 UDP，火火兔连不上。
#       必须有真公网 IP，或 frp / WireGuard 这类支持 UDP 的通道。

services:
  emqx:
    image: emqx/emqx:latest
    restart: always
    ports:
      - "1883:1883/tcp"
      - "18083:18083/tcp"
      - "8083:8083/tcp"
    volumes:
      - emqx-etc:/opt/emqx/etc
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    environment:
      EMQX_NODE_NAME: emqx@node1.emqx.io
    # 官方默认是允许匿名接入，因此玩具用自己的 devicekey/secret 就能连上，
    # 设备端 AT 指令也确实改不了 mqtt.username / mqtt.password（实测 Invalid MQTT command format）。
    # 若要收紧：浏览器打开 http://<公网IP>:18083 (admin/public) -> Access Control -> Authentication
    # 建 Password-Based 认证，再把玩具日志里看到的 username/password 加进用户表。

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "8082:80/tcp"
    volumes:
      - ./audio:/usr/share/nginx/html:ro

  folotoy:
    image: folotoy-server:aqing-cantonese   # 阿晴粤语女声 + edge-tts7 + 慢语速
    restart: always
    depends_on:
      - emqx
      - nginx
      - llm-gateway
    ports:
      - "8085:8085/udp"
    volumes:
      - ./audio:/audio
      - ./config:/config
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: INFO
      ROLES_FILE_PATH: /config/roles.json
      HTTPX_TIMEOUT: 90   # 长文/联网抓取需要更宽超时

      # === 对外地址（全部来自 .env 的 PUBLIC_HOST）===
      # AUDIO_DOWNLOAD_URL 必须带 http://；SPEECH_UDP_SERVER_HOST 不能带 http://、不能带端口。
      # 这个 UDP host 会由服务端下发给玩具，用来覆盖玩具本地的 udpSpeechServer.address
      #（AT 指令改不了这个字段，实测返回 Invalid keyName）。
      AUDIO_DOWNLOAD_URL: http://${PUBLIC_HOST}:8082
      AUDIO_SAVE_PATH: /audio
      SPEECH_UDP_SERVER_HOST: ${PUBLIC_HOST}
      SPEECH_UDP_SERVER_PORT: 8085

      # === 服务端自己连 EMQX 用的账号（不是玩具的账号）===
      MQTT_BROKER_HOST: emqx
      MQTT_BROKER_PORT: 1883
      MQTT_CLIENT_ID: folotoy
      MQTT_USERNAME: folotoy
      MQTT_PASSWORD: ${MQTT_PASSWORD:-folotoy}

      # === STT 语音转文字（耳朵）===
      # 耳朵和大脑用各自独立的一组变量，可分开选厂商（如 DeepSeek 大脑 + 硅基流动免费识别）。
      # 六个 LLM_*/STT_* 变量都在 .env 里显式填写，不用嵌套默认值，兼容所有 Compose 版本。
      # 没有 /audio/transcriptions 接口可把 STT_TYPE 改为 aliyun-asr / volcengine-asr / dify-stt。
      STT_TYPE: ${STT_TYPE}
      # v1.40: STT 改走本地代理（SenseVoiceSmall 上游间歇 500 -> 自动切 TeleSpeechASR）
      # 回滚：把下一行改回 ${STT_API_BASE} 并重建大脑即可，代理留着无害
      OPENAI_WHISPER_API_BASE: http://stt-proxy:8000/v1
      OPENAI_WHISPER_KEY: ${STT_API_KEY}
      OPENAI_WHISPER_MODEL: ${STT_MODEL}

      # === LLM 对话大脑 ===
      # 填任意 OpenAI 兼容的 /v1 地址即可：DeepSeek / 智谱 / 硅基流动 / one-api / Ollama 网关。
      # 注意：小智AI 官方 api.xiaozhi.me 只提供 MCP 端点（wss://api.xiaozhi.me/mcp/），
      #       不是 chat/completions 接口，不能直接填这里；要用 MCP 工具请看 INTEGRATION_MQTT。
      # 【关键】此处的 LLM_MODEL 必须和 config/roles.json 里的 "model" 写成同一个值，
      #        否则可能"环境填了 A、实际跑的是 B"，换模型时两个文件都要改。
      LLM_TYPE: openai
      OPENAI_OPENAI_API_BASE: http://llm-gateway:8000/v1   # 经阿晴联网网关转发
      OPENAI_OPENAI_KEY: ${LLM_API_KEY}
      OPENAI_OPENAI_MODEL: ${LLM_MODEL}

      # === TTS 文字转语音 ===
      # edge-tts 免费但慢；要更快可换 openai-tts / aliyun-tts / volcengine-tts，并补对应 key。
      TTS_TYPE: ${TTS_TYPE:-edge-tts}
      VOICE_EXECUTOR_MAX_WORKERS: 2

      # === 接小智AI / ClawBot 的开关 ===
      # 打开后服务端会把对话事件发到 MQTT topic，可用 xiaozhi_bridge.py 订阅，
      # 转发进本机 ClawBot（它已连 wss://api.xiaozhi.me/mcp/ 的小智 MCP 工具）。
      INTEGRATION_MQTT: ${INTEGRATION_MQTT:-false}

      STORAGE_TYPE: file


  # === v1.40 STT 容错代理：主 TeleSpeechASR -> 备 SenseVoiceSmall 自动切换 ===
  # 零依赖 stdlib，复用大脑镜像的 python3.11；无状态、不挂卷、不存 key（透传大脑请求的 Authorization）。
  # 只监听 compose 内网 8000，不映射宿主端口；大脑 base_url 指到 http://stt-proxy:8000/v1。
  stt-proxy:
    build:
      context: ./stt-proxy
      dockerfile: Dockerfile
    image: aqing-stt-proxy:1.0
    container_name: folotoy_stt_proxy_1
    restart: always
    environment:
      TZ: Asia/Shanghai
      PRIMARY_MODEL: TeleAI/TeleSpeechASR
      FALLBACK_MODEL: FunAudioLLM/SenseVoiceSmall
      UPSTREAM_URL: https://api.siliconflow.cn/v1/audio/transcriptions
      UPSTREAM_TIMEOUT: "30"
      STT_ALLOW_TEST: "0"
    # 无端口映射：仅 compose 内网可达；宿主查健康用 docker exec 即可。

  # === 阿晴增强网关：联网资讯检索 + 长文 + 主动定时播报 ===
  # 只把 folotoy 的 LLM_API_BASE 指到它；网关内部再转发硅基流动 GLM-4-9B。
  # 关掉增强：把上面 OPENAI_OPENAI_API_BASE 改回 ${LLM_API_BASE} 并删此服务即可。
  llm-gateway:
    image: aqing-gateway:1.47
    container_name: folotoy_llm_gateway_1
    restart: always
    depends_on:
      - emqx
    ports:
      - "8010:8000"          # 宿主可访问 /health、/chat、/logs；仅局域网，勿公网映射
    volumes:
      - ./audio:/audio                       # 与 nginx 共享，播报 MP3 直接落这里
      - ./conversations:/data/conversations  # 对话记录持久化卷（按天 JSONL，容器重建唔丢）
    environment:
      TZ: Asia/Shanghai
      PORT: 8000
      # === 对话记录（v1.23）===
      CONVERSATIONS_DIR: /data/conversations
      CONV_LOG: "1"          # 设 0 关闭落盘
      CONV_KEEP_DAYS: "30"   # v1.31 对话至少在线保留 30 天；超期主文件移 archive/ 仍可查、唔删
      CONV_PURGE_DAYS: "0"   # 0=永不永久删除；要清理归档先改成 N 天
      VIEW_TOKEN: ${VIEW_TOKEN:-}   # 查看页口令，留空=本机/局域网随便睇；要加固就填一串
      UPSTREAM_BASE: ${LLM_API_BASE}
      UPSTREAM_KEY: ${LLM_API_KEY}
      UPSTREAM_MODEL: ${LLM_MODEL}
      FETCH_TIMEOUT: 6
      CACHE_TTL: 300
      LONG_MAX_TOKENS: 1600
      HARD_MAX_CHARS: 1000
      HARD_MAX_TOKENS: 1800
      MODEL_OVERRIDE: Qwen/Qwen3-30B-A3B-Instruct-2507
      DUMP_MSG: ${DUMP_MSG:-0}
      AUTO_EN: ${AUTO_EN:-1}     # v1.25 闲聊键英文意图自动路由（保住英文例句/TTS发音）；设 0 关闭回滚
      FACT_CHECK: ${FACT_CHECK:-1}  # v1.26 每个角色讲资料前强制联网核查+专名保真；设 0 关闭回滚到 v1.25
      # v1.36 真流式透传（治长文「开口前干等」）：粤语角色句子级缓冲边生成边播，
      #   首句约3s开播（原憋全文26s）；英语老师/诗词自动保留旧整段路径。设 0 一键回滚到 v1.35 行为。
      GW_STREAMING: ${GW_STREAMING:-1}
      GW_STREAM_FLUSH_CHARS: ${GW_STREAM_FLUSH_CHARS:-90}  # 无句末标点时长句兜底切字数
      GW_STREAM_MIN_CHARS: ${GW_STREAM_MIN_CHARS:-8}       # 太短句(emoji/语气词)唔单独成帧
      NO_PROXY: api.siliconflow.cn,.cn,localhost,127.0.0.1,emqx
      no_proxy: api.siliconflow.cn,.cn,localhost,127.0.0.1,emqx
      # 主动定时播报开关 + 时间点（每天 08:00 / 18:00）
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      SCHEDULE: ${SCHEDULE:-08:00,18:00}
      MQTT_HOST: emqx
      SN: DEVICEKEY_REDACTED
      AUDIO_DIR: /audio
      AUDIO_BASE_URL: http://${PUBLIC_HOST}:8082
      LLM_GATEWAY: http://127.0.0.1:8000/v1
      NEWS_QUERY: 广州今日新闻同天气
      PARALLEL: 5
      VOICE: zh-HK-HiuMaanNeural
      NEWS_RATE: "${NEWS_RATE:-+0%}"   # v1.33 播报语速 1.0正常速(+0%)；只影响 news_broadcaster，不影响 7 键答话语速(+20%)

volumes:
  emqx-etc:
  emqx-data:
  emqx-log:
